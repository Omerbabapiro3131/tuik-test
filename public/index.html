<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İsim Sorgulama</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: #1e293b;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 450px;
    }

    h1 {
      text-align: center;
      font-size: 1.5rem;
      margin-bottom: 20px;
      color: #38bdf8;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.9rem;
      color: #94a3b8;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #38bdf8;
    }

    button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background-color: #0284c7;
      color: #fff;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #0369a1;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .result-container {
      margin-top: 20px;
      display: none;
    }

    .stat-box {
      background-color: #0f172a;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 10px;
      border: 1px solid #334155;
    }

    .stat-label {
      font-size: 0.8rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .stat-value {
      font-size: 1.25rem;
      font-weight: bold;
      color: #f8fafc;
      margin-top: 4px;
    }

    .global-counter {
      margin-top: 25px;
      padding-top: 15px;
      border-top: 1px dashed #334155;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>İsim Sorgulama</h1>

    <div class="form-group">
      <label for="isimInput">İsim</label>
      <input type="text" id="isimInput" placeholder="Örn: Ömer" autocomplete="off">
    </div>

    <div class="form-group">
      <label for="ilSelect">İl Seçin</label>
      <select id="ilSelect">
        <option value="34">İstanbul (34)</option>
        <option value="06">Ankara (06)</option>
        <option value="35">İzmir (35)</option>
        <option value="01">Adana (01)</option>
        <option value="02">Adıyaman (02)</option>
        <option value="03">Afyonkarahisar (03)</option>
        <option value="04">Ağrı (04)</option>
        <option value="05">Amasya (05)</option>
        <option value="07">Antalya (07)</option>
        <option value="08">Artvin (08)</option>
        <option value="09">Aydın (09)</option>
        <option value="10">Balıkesir (10)</option>
        <option value="11">Bilecik (11)</option>
        <option value="12">Bingöl (12)</option>
        <option value="13">Bitlis (13)</option>
        <option value="14">Bolu (14)</option>
        <option value="15">Burdur (15)</option>
        <option value="16">Bursa (16)</option>
        <option value="17">Çanakkale (17)</option>
        <option value="18">Çankırı (18)</option>
        <option value="19">Çorum (19)</option>
        <option value="20">Denizli (20)</option>
        <option value="21">Diyarbakır (21)</option>
        <option value="22">Edirne (22)</option>
        <option value="23">Elazığ (23)</option>
        <option value="24">Erzincan (24)</option>
        <option value="25">Erzurum (25)</option>
        <option value="26">Eskişehir (26)</option>
        <option value="27">Gaziantep (27)</option>
        <option value="28">Giresun (28)</option>
        <option value="29">Gümüşhane (29)</option>
        <option value="30">Hakkari (30)</option>
        <option value="31">Hatay (31)</option>
        <option value="32">Isparta (32)</option>
        <option value="33">Mersin (33)</option>
        <option value="36">Kars (36)</option>
        <option value="37">Kastamonu (37)</option>
        <option value="38">Kayseri (38)</option>
        <option value="39">Kırklareli (39)</option>
        <option value="40">Kırşehir (40)</option>
        <option value="41">Kocaeli (41)</option>
        <option value="42">Konya (42)</option>
        <option value="43">Kütahya (43)</option>
        <option value="44">Malatya (44)</option>
        <option value="45">Manisa (45)</option>
        <option value="46">Kahramanmaraş (46)</option>
        <option value="47">Mardin (47)</option>
        <option value="48">Muğla (48)</option>
        <option value="49">Muş (49)</option>
        <option value="50">Nevşehir (50)</option>
        <option value="51">Niğde (51)</option>
        <option value="52">Ordu (52)</option>
        <option value="53">Rize (53)</option>
        <option value="54">Sakarya (54)</option>
        <option value="55">Samsun (55)</option>
        <option value="56">Siirt (56)</option>
        <option value="57">Sinop (57)</option>

        <option value="69">Bayburt (69)</option>
        <option value="70">Karaman (70)</option>
        <option value="71">Kırıkkale (71)</option>
        <option value="72">Batman (72)</option>
        <option value="73">Şırnak (73)</option>
        <option value="74">Bartın (74)</option>
        <option value="75">Ardahan (75)</option>
        <option value="76">Iğdır (76)</option>
        <option value="77">Yalova (77)</option>
        <option value="78">Karabük (78)</option>
        <option value="79">Kilis (79)</option>
        <option value="80">Osmaniye (80)</option>
        <option value="81">Düzce (81)</option>
      </select>
    </div>

    <button id="sorgulaBtn" onclick="sorgula()">SORGULA</button>

    <div class="result-container" id="sonucKutusu">
      <div class="stat-box">
        <div class="stat-label">Sorgulanan İsim</div>
        <div class="stat-value" id="resIsim">-</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Seçilen İldeki Sayı</div>
        <div class="stat-value" id="resIlToplam">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Türkiye Geneli Sayı</div>
        <div class="stat-value" id="resTurkiyeToplam">0</div>
      </div>
    </div>

    <div class="global-counter">
      <div class="stat-label">TOPLAM YAPILAN SORGU</div>
      <div class="stat-value" id="toplamSorguSayac" style="color: #38bdf8;">Yükleniyor...</div>
    </div>
  </div>

  <script>
    async function ortakSayaciGetir() {
      try {
        const res = await fetch('/api/toplam-sorgu');
        const data = await res.json();
        if (data.toplam !== undefined) {
          document.getElementById('toplamSorguSayac').innerText = Number(data.toplam).toLocaleString('tr-TR');
        }
      } catch (e) {
        console.error("Sayaç yüklenemedi:", e);
      }
    }

    async function sorgula() {
      const isim = document.getElementById('isimInput').value.trim();
      const ilKodu = document.getElementById('ilSelect').value;
      const btn = document.getElementById('sorgulaBtn');
      const sonucKutusu = document.getElementById('sonucKutusu');

      if (!isim) {
        alert('Lütfen bir isim girin!');
        return;
      }

      btn.disabled = true;
      btn.innerText = 'Sorgulanıyor...';

      try {
        const response = await fetch(`/api/sorgula?isim=${encodeURIComponent(isim)}&ilKodu=${ilKodu}`);
        const data = await response.json();

        if (response.ok) {
          document.getElementById('resIsim').innerText = data.isim;
          document.getElementById('resIlToplam').innerText = Number(data.ilToplam).toLocaleString('tr-TR');
          document.getElementById('resTurkiyeToplam').innerText = Number(data.turkiyeToplam).toLocaleString('tr-TR');
          sonucKutusu.style.display = 'block';

          // Sorgulama bittiğinde ortak sayacı yeniden çekip güncelle
          ortakSayaciGetir();
        } else {
          alert(data.error || 'Bir hata oluştu!');
        }
      } catch (err) {
        alert('Sunucuya bağlanırken hata oluştu!');
      } finally {
        btn.disabled = false;
        btn.innerText = 'SORGULA';
      }
    }

    // Sayfa açıldığında ortak sayacı çek
    ortakSayaciGetir();
  </script>
</body>
</html>
