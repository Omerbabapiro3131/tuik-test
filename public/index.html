<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İsim İstatistik Sorgulama</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }
    body {
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      gap: 20px;
    }
    .card {
      background: #1e293b;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 440px;
      border: 1px solid #334155;
    }
    .live-card {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid #38bdf840;
      text-align: center;
    }
    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #38bdf820;
      color: #38bdf8;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .dot {
      width: 8px;
      height: 8px;
      background: #38bdf8;
      border-radius: 50%;
      box-shadow: 0 0 8px #38bdf8;
    }
    .live-counter {
      font-size: 2rem;
      font-weight: 800;
      color: #fff;
      font-family: monospace;
      letter-spacing: -1px;
    }
    h2 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: #fff;
    }
    p.subtitle {
      color: #94a3b8;
      font-size: 0.875rem;
      margin-bottom: 24px;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }
    input, select {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      padding: 12px 16px;
      border-radius: 8px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus {
      border-color: #38bdf8;
    }
    button {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      width: 100%;
    }
    button:hover {
      background: #7dd3fc;
    }
    .results {
      display: grid;
      gap: 12px;
    }
    .stat-box {
      background: #0f172a;
      padding: 16px;
      border-radius: 10px;
      border: 1px solid #1e293b;
    }
    .stat-label {
      color: #94a3b8;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }
    .stat-value {
      font-size: 1.25rem;
      font-weight: 700;
      color: #38bdf8;
    }
    .hidden {
      display: none;
    }
    .error {
      color: #f87171;
      font-size: 0.875rem;
      margin-top: 12px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Canlı Nüfus Kartı -->
  <div class="card live-card">
    <div class="live-badge">
      <span class="dot"></span> CANLI NÜFUS TAHMİNİ
    </div>
    <div class="live-counter" id="nufusSayac">85,372,377</div>
    <p class="subtitle" style="margin-bottom: 0; margin-top: 6px;">Türkiye Tahmini Anlık Nüfusu</p>
  </div>

  <!-- İsim Sorgulama Kartı -->
  <div class="card">
    <h2>İsim Sorgulama</h2>
    <p class="subtitle">Türkiye ve il bazlı isim istatistikleri</p>

    <div class="input-group">

      <select id="ilSelect">

        <option value="2">02 - Adıyaman</option>
        <option value="3">03 - Afyonkarahisar</option>
        <option value="4">04 - Ağrı</option>
        <option value="5">05 - Amasya</option>
        <option value="6">06 - Ankara</option>
        <option value="7">07 - Antalya</option>
        <option value="8">08 - Artvin</option>
        <option value="9">09 - Aydın</option>
        <option value="10">10 - Balıkesir</option>
        <option value="11">11 - Bilecik</option>
        <option value="12">12 - Bingöl</option>
        <option value="13">13 - Bitlis</option>
        <option value="14">14 - Bolu</option>
        <option value="15">15 - Burdur</option>
        <option value="16">16 - Bursa</option>
        <option value="17">17 - Çanakkale</option>
        <option value="18">18 - Çankırı</option>
        <option value="19">19 - Çorum</option>
        <option value="20">20 - Denizli</option>
        <option value="21">21 - Diyarbakır</option>
        <option value="22">22 - Edirne</option>
        <option value="23">23 - Elazığ</option>
        <option value="24">24 - Erzincan</option>
        <option value="25">25 - Erzurum</option>
        <option value="26">26 - Eskişehir</option>
        <option value="27">27 - Gaziantep</option>
        <option value="28">28 - Giresun</option>
        <option value="29">29 - Gümüşhane</option>
        <option value="30">30 - Hakkari</option>
        <option value="31">31 - Hatay</option>
        <option value="32">32 - Isparta</option>
        <option value="33">33 - Mersin</option>
        <option value="34" selected>34 - İstanbul</option>
        <option value="35">35 - İzmir</option>
        <option value="36">36 - Kars</option>
        <option value="37">37 - Kastamonu</option>
        <option value="38">38 - Kayseri</option>
        <option value="39">39 - Kırklareli</option>
        <option value="40">40 - Kırşehir</option>
        <option value="41">41 - Kocaeli</option>
        <option value="42">42 - Konya</option>
        <option value="43">43 - Kütahya</option>
        <option value="44">44 - Malatya</option>
        <option value="45">45 - Manisa</option>
        <option value="46">46 - Kahramanmaraş</option>
        <option value="47">47 - Mardin</option>
        <option value="48">48 - Muğla</option>
        <option value="49">49 - Muş</option>
        <option value="50">50 - Nevşehir</option>
        <option value="51">51 - Niğde</option>

        <option value="70">70 - Karaman</option>
        <option value="71">71 - Kırıkkale</option>
        <option value="72">72 - Batman</option>
        <option value="73">73 - Şırnak</option>
        <option value="74">74 - Bartın</option>
        <option value="75">75 - Ardahan</option>
        <option value="76">76 - Iğdır</option>
        <option value="77">77 - Yalova</option>
        <option value="78">78 - Karabük</option>
        <option value="79">79 - Kilis</option>
        <option value="80">80 - Osmaniye</option>
        <option value="81">81 - Düzce</option>
      </select>
      <button id="sorgulaBtn">Sorgula</button>
    </div>

    <div id="loading" class="hidden" style="text-align: center; color: #94a3b8;">Aranıyor...</div>
    <div id="error" class="error hidden"></div>

    <div id="results" class="results hidden">
      <div class="stat-box">
        <div class="stat-label">Sorgulanan İsim</div>
        <div class="stat-value" id="resIsim" style="color: #fff;">-</div>
      </div>
      <div class="stat-box">
        <div class="stat-label" id="resIlEtiket">Seçilen İl Kişi Sayısı</div>
        <div class="stat-value" id="resIl">-</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Türkiye Genel Sayısı</div>
        <div class="stat-value" id="resTurkiye">-</div>
      </div>
    </div>
  </div>

  <script>
    // Canlı Nüfus Sayacı Algoritması
    const baseNufus = 85372377;
    const baseDate = new Date('2024-01-01T00:00:00').getTime();
    
    function nufusGuncelle() {
      const now = new Date().getTime();
      const diffSeconds = (now - baseDate) / 1000;
      // Yaklaşık her 45 saniyede +1 nüfus artış simülasyonu
      const artis = Math.floor(diffSeconds / 45); 
      const guncel = baseNufus + artis;
      document.getElementById('nufusSayac').innerText = guncel.toLocaleString('tr-TR');
    }
    
    setInterval(nufusGuncelle, 1000);
    nufusGuncelle();

    // İsim Sorgulama Mantığı
    const btn = document.getElementById('sorgulaBtn');
    const input = document.getElementById('isimInput');
    const ilSelect = document.getElementById('ilSelect');
    const loading = document.getElementById('loading');
    const error = document.getElementById('error');
    const results = document.getElementById('results');

    async function sorgula() {
      const isim = input.value.trim();
      const ilKodu = ilSelect.value;
      const ilAdi = ilSelect.options[ilSelect.selectedIndex].text.split(' - ')[1];

      if (!isim) return;

      error.classList.add('hidden');
      results.classList.add('hidden');
      loading.classList.remove('hidden');

      try {
        const res = await fetch(`/api/sorgula?isim=${encodeURIComponent(isim)}&ilKodu=${ilKodu}`);
        const data = await res.json();

        loading.classList.add('hidden');

        if (data.error) {
          error.innerText = data.error;
          error.classList.remove('hidden');
          return;
        }

        document.getElementById('resIsim').innerText = data.isim;
        document.getElementById('resIlEtiket').innerText = `${ilAdi} Kişi Sayısı`;
        document.getElementById('resIl').innerText = data.ilToplam.toLocaleString('tr-TR');
        document.getElementById('resTurkiye').innerText = data.turkiyeToplam.toLocaleString('tr-TR');

        results.classList.remove('hidden');
      } catch (e) {
        loading.classList.add('hidden');
        error.innerText = 'Bağlantı kurulurken bir hata oluştu.';
        error.classList.remove('hidden');
      }
    }

    btn.addEventListener('click', sorgula);
    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sorgula();
    });
  </script>
</body>
</html>
